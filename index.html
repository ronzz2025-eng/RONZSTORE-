<style>
* { margin:0; padding:0; box-sizing:border-box; }

body, html {
    font-family: 'Poppins', sans-serif;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* Welcome Screen */
#welcome {
    text-align:center;
    animation: fadeIn 1.2s ease;
}
#welcome img{
    width:160px;
    margin-bottom:20px;
    filter: drop-shadow(0 0 15px #1e90ff);
}
#welcome h1{
    font-size:30px;
    color:#1e90ff;
    text-shadow:0 0 12px #1e90ff;
}
#welcome p{
    color:#aaa;
    margin:10px 0 25px;
}
#welcome button{
    padding:14px 40px;
    border-radius:12px;
    border:none;
    background:linear-gradient(135deg,#007bff,#1e90ff);
    color:white;
    font-weight:600;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 0 20px #1e90ff;
    transition:.3s;
}
#welcome button:hover{
    transform:scale(1.08);
    box-shadow:0 0 30px #1e90ff;
}

/* Overlay */
#overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.96);
    display:none;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card {
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:30px;
    text-align:center;
    max-width:420px;
    width:100%;
    box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

.logo {
    width:120px;
    border-radius:50%;
    margin-bottom:20px;
    border:4px solid #1e90ff;
}

.card h1 {
    margin-bottom:25px;
    text-shadow:0 0 10px #1e90ff;
}

.btn {
    display:block;
    margin:12px 0;
    padding:14px;
    border-radius:12px;
    text-decoration:none;
    font-weight:600;
    color:white;
    background:linear-gradient(135deg,#007bff,#1e90ff);
    transition:.3s;
}
.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 0 18px #1e90ff;
}

.note {
    margin-top:15px;
    font-size:14px;
    font-weight:bold;
    color:#1e90ff;
    text-shadow:0 0 10px #1e90ff;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow{
    from{ text-shadow:0 0 6px #1e90ff; }
    to{ text-shadow:0 0 14px #00bfff; }
}
@keyframes fadeIn{
    from{opacity:0; transform:scale(.9);}
    to{opacity:1; transform:scale(1);}
}
</style>
</head>

<!-- WELCOME SCREEN -->

<!-- MAIN OVERLAY -->
<div id="overlay">

        <h1>⧉𝐑𝐎𝐍𝐙 𝐒𝐓𝐎𝐑𝐄⧉</h1>

        <a href="https://wa.me/message/JFAMUULTHGK4O1" target="_blank" class="btn">WhatsApp REAL</a>
        <a href="https://whatsapp.com/channel/0029VbBr0y67oQhXa6lK9N1j" target="_blank" class="btn">Saluran WhatsApp</a>
        <a href="https://chat.whatsapp.com/Emynox0KD6T9QKiNg3XDCc" target="_blank" class="btn">Group WhatsApp</a>
        <a href="https://tiktok.com/@ronzstore16666" target="_blank" class="btn">TikTok</a>
        <a href="https://t.me/I16666Z" target="_blank" class="btn">Telegram</a>

        <p class="note">⚠️ SELAIN INI CLONE</p>
    </div>

<script>
